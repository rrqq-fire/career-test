
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律职业特质测评</title>
<style>
:root{--ink:#1e2440;--muted:#7a82a1;--line:#e6e9f5;--p1:#2f4fa8;--p2:#6f63d8;--p3:#9b54d6;
--grad:linear-gradient(135deg,#2f4fa8 0%,#6f63d8 55%,#9b54d6 100%)}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
body{min-height:100vh;color:var(--ink);background:#f4f6fd;overflow-x:hidden;padding:40px 16px 60px;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:float 16s ease-in-out infinite}
.b1{width:420px;height:420px;background:#9bb5ff;top:-120px;left:-100px}
.b2{width:380px;height:380px;background:#d6b4ff;bottom:-120px;right:-80px;animation-delay:-6s}
.b3{width:260px;height:260px;background:#a8e6ff;top:45%;left:60%;animation-delay:-10s;opacity:.3}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
header{text-align:center;margin-bottom:28px}
.badge{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--p1);background:rgba(47,79,168,.1);padding:6px 14px;border-radius:99px;margin-bottom:14px}
h1{font-size:32px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px}
.card{background:rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(74,90,170,.12)}
.progress{margin-bottom:28px}
.p-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.p-top b{color:var(--ink);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dots{display:flex;gap:8px;margin-top:12px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.3s}
.dots span.done{background:var(--p2)}
.dots span.now{width:24px;border-radius:99px;background:var(--p1)}
.stage{position:relative;min-height:380px}
.q{animation:in .45s cubic-bezier(.2,.8,.2,1)}
.q.back{animation:inBack .45s cubic-bezier(.2,.8,.2,1)}
.q.out{animation:out .25s ease forwards}
@keyframes in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-30px)}}
.q-no{font-size:13px;color:var(--p2);font-weight:600;letter-spacing:1px;margin-bottom:8px}
.q-title{font-size:21px;font-weight:600;line-height:1.5;margin-bottom:22px}
.opts{display:grid;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;background:#fff;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;font-size:15.5px;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;overflow:hidden}
.opt:hover{transform:translateY(-2px);border-color:#b9c6fa;box-shadow:0 8px 20px rgba(74,116,243,.12)}
.opt:focus-visible{outline:3px solid rgba(74,116,243,.35);outline-offset:2px}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:#eef1fc;color:var(--p1);display:grid;place-items:center;font-weight:700;font-size:14px;transition:.25s}
.opt.sel{border-color:var(--p2);background:linear-gradient(135deg,#f3f6ff,#f7f1ff);box-shadow:0 8px 24px rgba(106,100,240,.18)}
.opt.sel .k{background:var(--grad);color:#fff;transform:scale(1.08)}
.opt .ripple{position:absolute;border-radius:50%;background:rgba(106,100,240,.18);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.btn{border:none;cursor:pointer;font-size:15px;font-weight:600;padding:12px 24px;border-radius:14px;transition:.2s}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:#eef1fc}
.btn.ghost:disabled{opacity:.35;cursor:not-allowed}
.btn.main{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(106,100,240,.3)}
.btn.main:hover:not(:disabled){transform:translateY(-2px)}
.btn.main:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.soft{background:#eef1fc;color:var(--p1)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:11px}
/* result */
#result{display:none}
.r-hero{text-align:center;margin-bottom:20px;animation:in .6s both}
.r-tag{font-size:13px;color:var(--p2);letter-spacing:2px;margin-bottom:8px}
.r-name{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.r-sum{color:var(--muted);font-size:14.5px;line-height:1.7}
.radar-box{display:flex;justify-content:center;margin:8px 0 14px;animation:in .7s .1s both}
.radar-box svg{width:100%;max-width:320px;overflow:visible}
.poly{transform-origin:120px 120px;transform:scale(0);transition:transform 1s cubic-bezier(.2,.9,.3,1.2)}
.poly.show{transform:scale(1)}
.scores{display:grid;gap:14px;margin-bottom:12px;animation:in .7s .2s both}
.s-row{display:grid;grid-template-columns:100px 1fr 24px;gap:12px;align-items:center;font-size:13.5px}
.s-row .t{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.s-row .t i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.s-row b{text-align:right}
.s-desc{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-6px;padding-left:112px}
.second{font-size:13.5px;line-height:1.7;color:#4a5170;background:#f3f5ff;border-radius:12px;padding:10px 14px;margin-bottom:20px}
.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px;animation:in .7s .3s both}
.sec h4{font-size:14.5px;color:var(--p1);margin-bottom:10px}
.sec p{font-size:14.5px;line-height:1.85;color:#3a4160}
.sec ul,.sec ol{padding-left:20px}.sec li{font-size:14.5px;line-height:1.85;color:#3a4160;margin-bottom:4px}
.sec.scene{background:linear-gradient(135deg,#f6f8ff,#faf5ff)}
.sec.warn{background:#fffaf2;border-color:#f5e3c4}.sec.warn h4{color:#b8741a}
.jobs{display:grid;gap:12px}
.job{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfbff}
.job b{display:block;font-size:15.5px;color:#2b3a86;margin-bottom:4px}
.job .d{font-size:13.5px;line-height:1.7;color:#4a5170;margin-bottom:8px}
.job dl{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:13px;line-height:1.65}
.job dt{color:var(--p2);font-weight:600}.job dd{color:#4a5170}
.sec.motto{border:none;background:var(--grad)}
.sec.motto h4{color:rgba(255,255,255,.85)}.sec.motto p{color:#fff}
.r-actions{display:flex;gap:12px;margin-top:20px}.r-actions .btn{flex:1}
.disclaimer{text-align:center;color:#99a0bd;font-size:12px;line-height:1.7;margin-top:18px}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.card{padding:22px 18px}h1{font-size:26px}.q-title{font-size:18px}.s-row{grid-template-columns:84px 1fr 22px}.s-desc{padding-left:0}.job dl{grid-template-columns:1fr}.job dt{margin-top:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header>
    <div class="badge">LEGAL CAREER TRAITS</div>
    <h1>法律职业特质测评</h1>
    <div class="sub">5 道小题 · 约 1 分钟 · 仅供互动参考</div>
  </header>
  <section class="card" id="quiz">
    <div class="progress">
      <div class="p-top"><span>第 <b id="curNo">1</b> / 5 题</span><span id="pct">0%</span></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn">← 上一题</button>
      <button class="btn main" id="nextBtn" disabled>下一题 →</button>
    </div>
    <div class="hint">可按 <kbd>1</kbd>–<kbd>4</kbd> 或 <kbd>A</kbd>–<kbd>D</kbd> 选择,<kbd>←</kbd> 返回,<kbd>Enter</kbd> 下一步</div>
  </section>
  <section class="card" id="result"></section>
</div>
<div class="toast" id="toast"></div>

<script>
const TYPES = {
  A:{name:"法理思辨",desc:"法律检索、证据分析与逻辑推理"},
  B:{name:"创新策略",desc:"方案设计、规则创新与新兴领域探索"},
  C:{name:"沟通调解",desc:"当事人理解、协商调解与关系维护"},
  D:{name:"合规秩序",desc:"流程制度、风险管控与体系落地"}
};
/* 单项结果的“次要倾向”提示 */
const SECOND = {
  A:"遇到证据与规则问题时,你会比同类型的人更有底气,方案也更经得起推敲。",
  B:"面对僵局时,你比同类型的人更容易想出替代方案,为工作增加灵活度。",
  C:"你比同类型的人更懂得顾及当事人和同事的感受,沟通阻力会更小。",
  D:"你比同类型的人更重视落地与复盘,能让好的想法真正被执行。"
};

const QUESTIONS = [
  {t:"一间闲置玻璃房交给你改造,你想做成?",o:[["A","专门解决疑难问题的工作室"],["B","能不断试验新点子的创作间"],["C","让陌生人交换故事的小客厅"],["D","把混乱物品变有序的整理站"]]},
  {t:"旧档案里缺了最关键的一页,你会先?",o:[["A","对照前后线索还原真实内容"],["C","找到当事人,听他亲口讲述"],["B","设计另一种办法绕过缺失信息"],["D","建一套规则,避免以后再次丢失"]]},
  {t:"遇到一个全新领域的难题,你更倾向?",o:[["A","拆解逻辑,寻找证据推导答案"],["B","尝试多种方案试错,看哪个可行"],["C","找人沟通请教,参考他人经验"],["D","梳理流程,防止同类问题再次发生"]]},
  {t:"学会一项新技能后,你最想拿它来?",o:[["B","做出一件以前不存在的作品"],["C","帮一个人解决真实的难题"],["D","优化一套低效又麻烦的流程"],["A","研究它还能延伸出哪些可能"]]},
  {t:"哪种工作成果最让你觉得“这天值了”?",o:[["A","一个复杂问题终于被我看懂"],["B","我的想法变成了看得见的东西"],["C","有人因为我的帮助走出了卡点"],["D","一群人被我带着顺利完成目标"]]}
];

/* 职业库:[名称, 是什么, 日常工作, 核心能力, 入行路径, 常见压力点] */
const JOBS = {
 research:["法律研究员","为律师、法务或决策者回答“法律上能不能做、风险多大”的研究支持岗位。","检索法规与类案、撰写研究备忘录和法律意见初稿、跟踪立法与监管动态。","检索归纳、规范写作、对细节有耐心。","多见于律所研究/知识管理岗位、企业法务、智库与高校;通过法律职业资格考试并有研究或实务经历更有优势。","成果多在幕后,较少直接面对客户;截止期压力集中。"],
 litigator:["诉讼 / 争议解决律师","代理民商事或行政案件,在诉讼或仲裁中主张当事人权利。","梳理证据、撰写起诉状与答辩状、庭前准备与出庭、参与和解谈判。","证据分析、逻辑表达、临场应变、抗压。","通过国家统一法律职业资格考试,完成实习(一般为一年)后申请律师执业,多从律所助理做起。","案件周期长、结果不确定,客户期待与工作强度压力较大。"],
 compliance:["合规风控分析师","在企业内部识别并评估法律与监管风险的岗位。","梳理业务流程中的风险点、跟踪监管新规、出具风险评估报告并跟进整改。","法规解读、流程理解、与业务沟通。","常从企业法务/合规专员、律所合规团队或监管咨询机构起步。","容易被业务视为“拦路者”,需要在风险与业务节奏间平衡。"],
 judgeasst:["法官助理 / 司法文书研究","在司法机关协助办案并整理裁判思路。","审查证据材料、归纳争议焦点、起草法律文书、协助庭审与调解。","事实认定、文书写作、程序意识。","通常需通过法律职业资格考试,并经公务员招录或相关遴选进入法院系统,具体以招录公告为准。","案多人少、工作量大;职业行为受严格纪律约束。"],
 antitrust:["竞争法 / 反垄断研究","分析企业行为是否可能影响市场竞争。","评估经营者集中申报、分析市场份额与竞争影响、应对反垄断调查。","法律分析加基础经济学与数据能力。","多在律所竞争法团队、企业合规部门、咨询机构或监管相关研究机构。","专业门槛高,需要阅读大量经济与行业数据。"],
 criminal:["刑事辩护律师","为犯罪嫌疑人、被告人提供辩护,维护其合法权利。","会见当事人、阅卷、梳理证据与程序问题、出庭辩护、与办案机关沟通。","证据与程序分析、与当事人建立信任、心理承压。","取得律师执业资格后,多从刑辩团队助理做起,需要长期案件积累。","案件涉及人身自由,心理压力大,对职业伦理要求高。"],
 aml:["反洗钱与监管合规","银行、支付、证券等金融机构的监管合规岗位。","制定客户尽调与交易监测规则、调查可疑交易、撰写报告、应对监管检查。","监管规则理解、数据敏感、细致。","多在金融机构合规部、合规咨询公司或律所金融合规团队。","监管政策更新快,需要持续学习。"],
 ip:["知识产权律师","处理专利、商标、著作权与商业秘密的保护与纠纷。","商标检索与布局、侵权分析、撰写律师函、代理侵权诉讼或无效程序。","法律加技术或品牌理解、策略思维。","取得律师资格;专利方向通常还需理工科背景,并考取专利代理师资格。","技术类案件需要持续补课,行业知识跨度大。"],
 legaltech:["法律科技产品经理","把法务需求变成数字产品。","访谈法务用户、梳理合同审查/电子签/案件管理等场景、与研发协作迭代产品。","需求拆解、法律理解、跨团队沟通。","多由法务/律师转型,或由产品经理加法律背景进入;常见于法律科技公司与大型企业数字化团队。","需要同时对法律准确性与产品体验负责。"],
 emerging:["新兴领域法律顾问(数据合规 / AI 治理)","为数据与 AI 业务提供合规支持。","评估个人信息处理合法性、起草隐私政策与数据协议、数据跨境评估、算法与生成式 AI 合规。","法规理解、与技术团队沟通、合规方案设计。","常在互联网公司法务、律所数据合规团队或咨询机构;可考取隐私合规相关专业认证。","规则仍在发展,答案常不唯一,需要持续跟踪监管动向。"],
 deal:["交易架构律师(并购 / 投融资)","为企业交易提供法律方案与文件。","设计交易结构、起草与谈判投资或并购协议、协调尽调与交割。","条款敏感度、商业理解、项目统筹。","多从律所公司业务/资本市场团队助理做起,也可在企业法务或投行相关岗位发展。","项目周期紧,高强度工作较常见。"],
 advocacy:["公益倡导与政策研究","推动法律议题被看见、被改进。","整理典型案例与数据、撰写政策建议与研究报告、参与公益诉讼或立法意见征集。","议题洞察、研究写作、公共表达。","多在公益组织、研究机构、高校与律协公益业务相关部门。","成效周期长,资源有限。"],
 edu:["法治传播与普法策划","把法律知识讲给普通人听。","选题策划、撰写科普文章与短视频脚本、组织进校园进社区活动、把关内容准确性。","通俗表达、选题敏感度、法律准确。","多在司法行政机关、普法部门、律协与公益组织、媒体及法律自媒体。","在“通俗”与“准确”之间容易失衡,需要专业审校。"],
 mediator:["调解员 / 仲裁员","在冲突各方之间居中解决争议。","听取各方陈述、梳理分歧、提出方案、制作调解协议或仲裁裁决。","倾听、中立、谈判、法律判断。","调解员可经人民调解委员会、商事调解机构等进入;仲裁员由仲裁机构聘任,通常对年限与资历有要求,以机构规定为准。","需要持续保持中立,常遇到情绪化场面。"],

/* ===== 状态与渲染 ===== */
const $ = id => document.getElementById(id);
let cur = 0, answers = Array(QUESTIONS.length).fill(null), lock = false;
const dots = $("dots");
QUESTIONS.forEach(()=>dots.appendChild(document.createElement("span")));

function renderQ(dir){
  const q = QUESTIONS[cur], stage = $("stage");
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "q"+(dir==="back"?" back":"");
  box.innerHTML = `<div class="q-no">QUESTION ${String(cur+1).padStart(2,"0")}</div><div class="q-title">${q.t}</div><div class="opts" role="radiogroup"></div>`;
  const opts = box.querySelector(".opts");
  q.o.forEach(([type,text],i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="opt"+(answers[cur]===i?" sel":"");
    b.setAttribute("role","radio"); b.setAttribute("aria-checked",answers[cur]===i);
    b.innerHTML = `<span class="k">${"ABCD"[i]}</span><span>${text}</span>`;
    b.addEventListener("click",e=>choose(i,e,b));
    opts.appendChild(b);
  });
  stage.appendChild(box); updateUI();
}
function updateUI(){
  const done = answers.filter(a=>a!==null).length;
  $("curNo").textContent = cur+1;
  const pct = Math.round(done/QUESTIONS.length*100);
  $("barFill").style.width = pct+"%"; $("pct").textContent = pct+"%";
  [...dots.children].forEach((d,i)=>{d.className = i===cur?"now":(answers[i]!==null?"done":"")});
  $("prevBtn").disabled = cur===0;
  $("nextBtn").textContent = cur===QUESTIONS.length-1 ? "查看结果 ✨" : "下一题 →";
  $("nextBtn").disabled = answers[cur]===null;
}
function choose(i,e,btn){
  if(lock) return;
  answers[cur]=i;
  document.querySelectorAll(".opt").forEach((o,idx)=>{o.classList.toggle("sel",idx===i);o.setAttribute("aria-checked",idx===i)});
  if(e && e.clientX!==undefined && btn){
    const r=btn.getBoundingClientRect(), s=document.createElement("span"), size=60;
    s.className="ripple";
    s.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
    btn.appendChild(s); setTimeout(()=>s.remove(),600);
  }
  updateUI();
  if(cur<QUESTIONS.length-1){ lock=true; setTimeout(()=>{lock=false;go(1)},420); }
}
function go(step){
  const target = cur+step;
  if(target<0) return;
  if(target>=QUESTIONS.length){ if(answers.every(a=>a!==null)) showResult(); return; }
  const old = document.querySelector(".q");
  const swap = ()=>{cur=target;renderQ(step<0?"back":"fwd")};
  if(old){old.classList.add("out");setTimeout(swap,230)} else swap();
}

function showResult(){
  const count={A:0,B:0,C:0,D:0};
  answers.forEach((a,qi)=>count[QUESTIONS[qi].o[a][0]]++);
  const max=Math.max(...Object.values(count));
  const tops=Object.keys(count).filter(k=>count[k]===max).sort();
  // 5题4类:最高票只可能是1项或2项并列
  const R = tops.length===1 ? SINGLE[tops[0]] : PAIR[tops.join("")];
  const seq = answers.map((a,qi)=>QUESTIONS[qi].o[a][0]).join("");

  // 单项结果:次要倾向
  let secondHtml="";
  if(tops.length===1){
    const rest=Object.keys(count).filter(k=>k!==tops[0]).sort((a,b)=>count[b]-count[a]);
    const s=rest[0];
    if(count[s]>0) secondHtml=`<div class="second">🔎 <b>次要倾向:${TYPES[s].name}(${count[s]} 票)</b>——${SECOND[s]}</div>`;
  }

  const cx=120,cy=120,rad=90,ang={A:-90,B:0,C:90,D:180};
  const pt=(k,v)=>{const a=ang[k]*Math.PI/180,r=rad*v;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=v=>["A","B","C","D"].map(k=>pt(k,v).join(",")).join(" ");
  const poly=["A","B","C","D"].map(k=>pt(k,Math.max(count[k]/5,.06)).join(",")).join(" ");
  const labels=["A","B","C","D"].map(k=>{const [x,y]=pt(k,1.32);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#5c6489" font-weight="600">${TYPES[k].name}</text>`}).join("");
  const axes=["A","B","C","D"].map(k=>{const [x,y]=pt(k,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e1e5f5"/>`}).join("");
  const rings=[.33,.66,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="#e1e5f5"/>`).join("");
  const rows=["A","B","C","D"].map(k=>`<div class="s-row"><span>${TYPES[k].name}</span><div class="t"><i data-w="${count[k]/5*100}"></i></div><b>${count[k]}</b><div class="s-desc">${TYPES[k].desc}</div></div>`).join("");
  const jobs=R.jobs.map(id=>{const j=JOBS[id];return `<div class="job"><b>${j[0]}</b><div class="d">${j[1]}</div><dl><dt>日常工作</dt><dd>${j[2]}</dd><dt>核心能力</dt><dd>${j[3]}</dd><dt>入行路径</dt><dd>${j[4]}</dd><dt>常见压力</dt><dd>${j[5]}</dd></dl></div>`}).join("");

  const el=$("result");
  el.innerHTML=`
    <div class="r-hero"><div class="r-tag">YOUR PROFILE · ${R.tag}</div><div class="r-name">${R.title}</div><div class="r-sum">${R.sum}</div></div>
    <div class="radar-box"><svg viewBox="0 0 240 240">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f4fa8" stop-opacity=".55"/><stop offset="1" stop-color="#9b54d6" stop-opacity=".55"/></linearGradient></defs>
      ${rings}${axes}<polygon class="poly" id="poly" points="${poly}" fill="url(#g)" stroke="#6f63d8" stroke-width="2" stroke-linejoin="round"/>${labels}</svg></div>
    <div class="scores">${rows}</div>
    ${secondHtml}
    <div class="sec"><h4>🔬 专业解读</h4><p>${R.mind}</p></div>
    <div class="sec scene"><h4>📌 一个典型的工作场景</h4><p>${R.scene}</p></div>
    <div class="sec"><h4>⚖ 你在法律工作中的优势</h4><ul>${R.strengths.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="sec"><h4>🏢 更适合的工作环境</h4><p>${R.env}</p></div>
    <div class="sec warn"><h4>⚠ 需要留意的盲区</h4><p>${R.blind}</p></div>
    <div class="sec"><h4>🌱 近期可以做的 3 件事</h4><ol>${R.actions.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    <div class="sec"><h4>🧭 适合关注的法律职业方向</h4><div class="jobs">${jobs}</div></div>
    <div class="sec motto"><h4>💬 寄语</h4><p>${R.motto}</p></div>
    <div class="r-actions"><button class="btn soft" id="copyBtn">复制结果</button><button class="btn main" id="retryBtn">重新测评</button></div>
    <div class="disclaimer">答题序列 ${seq} · 本测评仅供互动与自我探索参考,不构成专业职业评估或法律意见。<br>职业说明为一般性介绍,具体岗位要求、资格条件与入行路径请以官方规定及所在机构为准。</div>`;

  $("quiz").style.display="none"; el.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
  requestAnimationFrame(()=>setTimeout(()=>{
    $("poly").classList.add("show");
    el.querySelectorAll(".t i").forEach(i=>i.style.width=i.dataset.w+"%");
  },150));
  $("retryBtn").onclick=reset;
  $("copyBtn").onclick=()=>{
    const txt=`【法律职业特质测评】${R.title}\n${R.sum}\n适合关注:${R.jobs.map(id=>JOBS[id][0]).join("、")}\n得分:`+["A","B","C","D"].map(k=>`${TYPES[k].name}${count[k]}`).join(" / ")+`\n(仅供互动参考)`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("已复制到剪贴板 ✅")).catch(()=>toast("复制失败,请手动选择文字"));
  };
}
function reset(){
  answers=Array(QUESTIONS.length).fill(null); cur=0; lock=false;
  $("result").style.display="none"; $("quiz").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"}); renderQ();
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

$("prevBtn").onclick=()=>go(-1);
$("nextBtn").onclick=()=>{ if(answers[cur]!==null) go(1) };
document.addEventListener("keydown",e=>{
  if($("quiz").style.display==="none") return;
  const k=e.key.toUpperCase();
  const idx="ABCD".indexOf(k)>=0?"ABCD".indexOf(k):"1234".indexOf(k);
  if(idx>=0 && idx<4 && !e.ctrlKey && !e.metaKey){ choose(idx); const o=document.querySelectorAll(".opt")[idx]; o&&o.focus(); }
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="Enter" && answers[cur]!==null && document.activeElement.tagName!=="BUTTON") go(1);
});
renderQ();
</script>
</body>
</html>
